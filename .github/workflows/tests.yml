name: Проверки

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  tests:
    name: Тесты и сверка событий
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Поставить Godot
        run: |
          GODOT_VERSION=4.7.1
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          chmod +x /usr/local/bin/godot
          godot --version

      - name: Собрать пак сэмплов для проверок
        run: python3 examples/04_own_samples/make_pack.py

      - name: Импорт
        run: godot --headless --path . --import

      - name: Тесты
        run: |
          godot --headless --path . --script res://tests/run_tests.gd | tee tests.log
          grep -q "бед 0" tests.log

      - name: Сверка событий с эталоном Булки
        run: |
          godot --headless --path . --script res://tools/judge/run_corpus.gd
          python3 tools/judge/compare.py

      - name: Главная приёмка — целый трек
        run: |
          godot --headless --path . --script res://tools/judge/run_track.gd
          python3 tools/judge/compare.py --track

      - name: Установка с нуля в пустой проект
        run: bash tools/check_clean_install.sh
        env:
          GODOT: /usr/local/bin/godot
